{% extends "admin/base_site.html" %}
{% load static %}
{% block branding %}
<div id="site-name">
  <a href="{% url 'admin:index' %}" class="portal-admin-brand">
    <img class="light-logo" src="{% static 'brand/' %}{{ portal_brand.symbol }}" height="32" alt="">
    <img class="dark-logo" src="{% static 'brand/' %}{{ portal_brand.symbolDark }}" height="32" alt="">
    {{ portal_brand.product }} · مدیریت سامانه
  </a>
</div>
{% endblock %}
{% block extrahead %}{{ block.super }}
<link rel="icon" href="{% static 'brand/' %}{{ portal_brand.symbol }}">
<link rel="stylesheet" href="{% static 'brand/admin.css' %}">
{% endblock %}
