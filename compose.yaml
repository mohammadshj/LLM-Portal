services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    stop_grace_period: 35s
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:${PORTAL_HTTP_PORT:-8080}:80"
    volumes:
      - static_data:/srv/static:ro
    depends_on:
      - backend
    restart: unless-stopped
  cleanup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        minute=0
        while true; do
          python manage.py recover_reservations
          if [ "$$minute" -eq 0 ]; then python manage.py purge_history; fi
          minute=$$(( (minute + 1) % 1440 ))
          sleep 60
        done
    restart: unless-stopped
volumes:
  postgres_data:
  static_data:
