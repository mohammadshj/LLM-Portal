{% extends "admin/base_site.html" %}
{% block content %}
<p>{{ ids|length }} حساب انتخاب شده است.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}

<button type="submit" name="confirm_credit">ثبت تغییر اعتبار</button>
</form>{% endblock %}
