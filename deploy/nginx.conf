limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
resolver 127.0.0.11 valid=10s ipv6=off;
upstream portal_backend {
    zone portal_backend 64k;
    server backend:8000 resolve;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /api/auth/login/ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://portal_backend;
        proxy_set_header Host $http_host;
    }
    location /api/ {
        proxy_pass http://portal_backend;
        proxy_read_timeout 170s;
        proxy_set_header Host $http_host;
    }
    location /admin/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://portal_backend;
        proxy_set_header Host $http_host;
    }
    location /static/ { alias /srv/static/; }
    location / { try_files $uri $uri/ /index.html; }
}
